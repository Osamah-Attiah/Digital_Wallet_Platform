extensions:
  health_check: {endpoint: "0.0.0.0:13133"}
receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
        tls: {cert_file: /run/tls/collector.crt, key_file: /run/tls/collector.key}
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 128}
  batch: {timeout: 1s, send_batch_size: 128}
exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    resource_to_telemetry_conversion: {enabled: false}
service:
  extensions: [health_check]
  pipelines:
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus]}
    # Traces are not exported to an external sink in this synthetic demonstration.
