      ],
      "user": "999:999",
      "volumes": [
        {
          "type": "bind",
          "source": "./redis.sh",
          "target": "/run-config/redis.sh",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "bind",
          "source": "${WALLET_TLS_DIR}/redis",
          "target": "/run/tls",
          "read_only": true
        }
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "worker": {
      "cap_drop": [
